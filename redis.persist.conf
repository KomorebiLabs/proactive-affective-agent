# Redis 配置文件 for 婉情AI
# 保存到 Redis 安装目录，如 C:\Program Files\Redis\redis.windows.conf

# ==================== 网络 ====================
bind 127.0.0.1
port 6379
timeout 0

# ==================== 持久化 ====================
# RDB 快照（默认开启，每15分钟至少有1个更改时保存）
save 900 1
save 300 10
save 60 10000

# AOF 持久化（推荐：每秒同步，更安全）
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# AOF 重写配置
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ==================== 内存 ====================
maxmemory 256mb
maxmemory-policy allkeys-lru

# ==================== 日志 ====================
loglevel notice
logfile ""

# ==================== 安全（可选）====================
# 如果需要密码，取消下面的注释并设置密码
# requirepass your_redis_password_here
